name: AOV UABE 2.4 Windows candidate
on:
  push:
    branches: [release/2.4]
permissions:
  contents: read
jobs:
  build-install:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Provide Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe')) -and !(Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --version=6.5.4 -y --no-progress
            if ($LASTEXITCODE) { throw 'Could not install Inno Setup' }
          }
      - name: Build and test
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Install and capture the real Windows app
        shell: pwsh
        run: ./packaging/windows/verify-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AOV_UABE_2022-2.4-Windows-verified
          path: artifacts/
          if-no-files-found: error
